server {
    # 监听端口
    listen 80;
    
    # 服务器名称（根据需要修改为您的域名或IP）
    server_name localhost report-generator.local;

    # 网站根目录 - 指向您的dist目录
    root /path/to/your/project/dist;  # 请修改为实际路径: C:/Users/msi/Desktop/code/2.报告生成器/dist

    # 默认首页文件
    index index.html;

    # 字符集
    charset utf-8;

    # 访问日志（可选）
    access_log /var/log/nginx/report-generator.access.log;
    error_log /var/log/nginx/report-generator.error.log;

    # 安全头配置
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 静态资源缓存配置
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        
        # 处理跨域请求（如果需要）
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
        add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept";
    }

    # HTML文件不缓存
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # 主要路由配置 - SPA应用路由处理
    location / {
        try_files $uri $uri/ /index.html;
        
        # 防止缓存index.html
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # API代理配置（根据您的后端API地址修改）
    location /api/ {
        # 代理到后端API服务器
        proxy_pass http://localhost:8080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 处理favicon.ico
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    # 处理robots.txt
    location = /robots.txt {
        log_not_found off;
        access_log off;
    }

    # 错误页面配置
    error_page 404 /index.html;
    error_page 500 502 503 504 /index.html;

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 禁止访问备份文件
    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Gzip压缩配置
    location ~* \.(js|css|html|xml|txt)$ {
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_comp_level 6;
        gzip_types
            text/plain
            text/css
            text/xml
            text/javascript
            application/json
            application/javascript
            application/xml+rss
            application/atom+xml
            image/svg+xml;
    }
}